<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEAN RUNNER · Chombus</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐶%3C/text%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Comic Sans MS', 'Comic Sans', 'Chalkboard SE', cursive;
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: linear-gradient(45deg,
        #ff006e, #ff8500, #ffd700, #00ff7f, #00bfff, #8a2be2, #ff1493);
      background-size: 400% 400%;
      animation: gradientShift 18s ease infinite;
    }
    body::after {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.18), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(255,215,0,0.22), transparent 40%);
      pointer-events: none;
      z-index: -1;
    }
    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Top bar */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1rem;
      z-index: 50;
      pointer-events: none;
      flex-wrap: wrap;
    }
    .topbar a, .topbar .stat {
      pointer-events: auto;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 3px solid gold;
      border-radius: 14px;
      padding: 0.45rem 0.9rem;
      color: white;
      text-decoration: none;
      font-weight: 900;
      font-size: 1rem;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.6);
      letter-spacing: 0.06em;
      font-family: inherit;
    }
    .topbar a:hover { background: gold; color: black; }
    .stats-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .stat .label {
      display: block;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      opacity: 0.7;
      line-height: 1;
      margin-bottom: 2px;
    }
    .stat .val {
      font-size: 1.15rem;
      color: gold;
      text-shadow: 2px 2px 0 #000, 0 0 8px rgba(255,215,0,0.7);
    }
    #speed-stat .val { color: #ff4081; }

    /* Title — BEAN RUNNER */
    #title {
      position: fixed;
      top: 4.6rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(1.8rem, 6vw, 3.4rem);
      font-weight: 900;
      margin: 0;
      letter-spacing: 0.06em;
      text-shadow: 4px 4px 0 rgba(0,0,0,0.45);
      filter: drop-shadow(0 0 24px rgba(255,255,255,0.35));
      z-index: 40;
      pointer-events: none;
      white-space: nowrap;
    }
    #title span { display: inline-block; animation: bounce 1.2s ease-in-out infinite; }
    #title .sp { width: 0.45em; animation: none; }
    #title span:nth-child(1)  { color: #ff1744; animation-delay: 0.00s; }
    #title span:nth-child(2)  { color: #ff9100; animation-delay: 0.06s; }
    #title span:nth-child(3)  { color: #ffea00; animation-delay: 0.12s; }
    #title span:nth-child(4)  { color: #00e676; animation-delay: 0.18s; }
    #title span:nth-child(6)  { color: #00b0ff; animation-delay: 0.30s; }
    #title span:nth-child(7)  { color: #b388ff; animation-delay: 0.36s; }
    #title span:nth-child(8)  { color: #ff4081; animation-delay: 0.42s; }
    #title span:nth-child(9)  { color: #ff1744; animation-delay: 0.48s; }
    #title span:nth-child(10) { color: #ff9100; animation-delay: 0.54s; }
    #title span:nth-child(11) { color: #ffea00; animation-delay: 0.60s; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(-4deg) scale(1); }
      50%      { transform: translateY(-14px) rotate(4deg) scale(1.12); }
    }

    /* Stage */
    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    /* Ground */
    #ground {
      position: absolute;
      left: 0; right: 0;
      top: 70vh;
      bottom: 0;
      background:
        repeating-linear-gradient(90deg,
          rgba(255,255,255,0.18) 0,
          rgba(255,255,255,0.18) 60px,
          rgba(0,0,0,0.18) 60px,
          rgba(0,0,0,0.18) 120px),
        linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.7));
      border-top: 6px solid gold;
      box-shadow: 0 -8px 30px rgba(255,215,0,0.5), inset 0 6px 20px rgba(255,255,255,0.15);
      will-change: background-position;
    }
    #ground::before {
      content: '';
      position: absolute;
      left: 0; right: 0; top: -3px; height: 6px;
      background: linear-gradient(90deg, transparent, white, transparent);
      animation: groundShimmer 2.4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes groundShimmer {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 0.9; }
    }

    /* Parallax layers */
    .parallax {
      position: absolute;
      inset: 0;
      pointer-events: none;
      will-change: background-position;
    }
    #stars {
      background-image:
        radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,0.9), transparent),
        radial-gradient(1px 1px at 30% 50%, rgba(255,255,255,0.7), transparent),
        radial-gradient(2px 2px at 60% 30%, rgba(255,255,255,0.85), transparent),
        radial-gradient(1px 1px at 80% 70%, rgba(255,255,255,0.6), transparent),
        radial-gradient(2px 2px at 90% 15%, rgba(255,255,255,0.85), transparent),
        radial-gradient(1px 1px at 45% 80%, rgba(255,255,255,0.7), transparent),
        radial-gradient(2px 2px at 22% 65%, rgba(255,215,0,0.85), transparent),
        radial-gradient(1px 1px at 70% 55%, rgba(255,215,0,0.7), transparent);
      background-size: 600px 400px;
      opacity: 0.85;
    }
    #clouds { font-size: 0; }
    .cloud {
      position: absolute;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,0.3));
      will-change: transform, left;
    }

    /* Bean */
    #bean {
      position: absolute;
      width: 90px; height: 90px;
      border-radius: 50%;
      border: 6px solid white;
      box-shadow: 0 0 0 4px gold, 0 0 35px rgba(255,215,0,0.9), 0 12px 28px rgba(0,0,0,0.45);
      background: white center/cover no-repeat;
      will-change: transform, top, left;
      z-index: 10;
      animation: beanRun 0.55s ease-in-out infinite;
    }
    #bean::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(ellipse 70% 60% at 30% 25%, rgba(255,255,255,0.45), transparent 55%);
      pointer-events: none;
    }
    @keyframes beanRun {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50%      { transform: translateY(-6px) rotate(8deg); }
    }
    #beanShadow {
      position: absolute;
      width: 80px; height: 14px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0,0,0,0.55), transparent 70%);
      will-change: transform, opacity, top, left;
      z-index: 9;
      pointer-events: none;
    }

    .obstacle, .treat {
      position: absolute;
      border-radius: 50%;
      border: 5px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      will-change: transform, left;
      z-index: 8;
      line-height: 1;
    }
    .obstacle {
      width: 70px; height: 70px;
      font-size: 2.5rem;
      box-shadow: 0 0 0 3px #ff1744, 0 6px 20px rgba(0,0,0,0.55), 0 0 30px rgba(255,23,68,0.45);
      animation: obstacleWobble 0.7s ease-in-out infinite;
    }
    @keyframes obstacleWobble {
      0%, 100% { transform: rotate(-6deg) scale(1); }
      50%      { transform: rotate(6deg) scale(1.05); }
    }
    .treat {
      width: 56px; height: 56px;
      font-size: 2rem;
      background: linear-gradient(135deg, #fff7c2, #ffd700);
      box-shadow: 0 0 0 3px gold, 0 0 28px rgba(255,215,0,0.95), 0 6px 14px rgba(0,0,0,0.4);
      animation: treatSpin 1.1s linear infinite;
    }
    @keyframes treatSpin {
      0%   { transform: rotate(0deg) scale(1); }
      50%  { transform: rotate(180deg) scale(1.12); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .sparkle {
      position: absolute;
      pointer-events: none;
      font-size: 1.1rem;
      filter: drop-shadow(0 0 6px rgba(255,255,255,0.85));
      will-change: transform, opacity;
      z-index: 12;
    }
    .popup {
      position: absolute;
      font-weight: 900;
      font-size: 1.6rem;
      color: gold;
      text-shadow: 3px 3px 0 #000, 0 0 14px rgba(255,215,0,0.9);
      pointer-events: none;
      z-index: 30;
      letter-spacing: 0.05em;
      font-family: inherit;
    }
    .milestone {
      position: fixed;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(2.2rem, 8vw, 5rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-align: center;
      pointer-events: none;
      z-index: 60;
      text-shadow: 5px 5px 0 #000, 0 0 30px rgba(255,255,255,0.7);
      white-space: nowrap;
      font-family: inherit;
    }

    /* Cursor */
    @media (hover: hover) {
      html, body, * { cursor: none !important; }
    }
    .cursor-dot {
      position: fixed;
      top: 0; left: 0;
      width: 36px; height: 36px;
      margin-left: -18px; margin-top: -18px;
      pointer-events: none;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      filter: drop-shadow(0 0 10px rgba(255,215,0,0.9)) drop-shadow(0 0 20px rgba(255,255,255,0.5));
      will-change: transform;
      animation: cursorPulse 1s ease-in-out infinite;
    }
    @keyframes cursorPulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50%      { transform: scale(1.25) rotate(180deg); }
    }
    .cursor-trail {
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      font-size: 1rem;
      filter: drop-shadow(0 0 8px rgba(255,215,0,0.9));
      will-change: transform, opacity;
    }
    @media (hover: none) {
      .cursor-dot { display: none; }
    }

    /* Overlays */
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 100;
      padding: 1rem;
      text-align: center;
    }
    .overlay.hidden { display: none; }

    #countdown {
      font-size: clamp(4rem, 18vw, 12rem);
      font-weight: 900;
      color: gold;
      text-shadow: 6px 6px 0 #000, 0 0 40px rgba(255,215,0,0.9);
      letter-spacing: 0.05em;
      line-height: 1;
    }
    #countdown .ready {
      font-size: clamp(1.4rem, 5vw, 2.6rem);
      display: block;
      color: white;
      letter-spacing: 0.16em;
      margin-bottom: 0.5rem;
    }
    .controls-hint {
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      opacity: 0.85;
      text-shadow: 2px 2px 0 #000;
      letter-spacing: 0.1em;
      max-width: 90vw;
    }

    .gameover-card {
      background: rgba(0,0,0,0.78);
      border: 5px solid gold;
      border-radius: 24px;
      padding: 1.6rem 2.2rem;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.15), 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(255,215,0,0.55);
      max-width: 90vw;
    }
    .gameover-card h2 {
      margin: 0 0 0.6rem 0;
      font-size: clamp(2rem, 7vw, 3.6rem);
      color: #ff1744;
      letter-spacing: 0.1em;
      text-shadow: 4px 4px 0 #000, 0 0 24px rgba(255,23,68,0.6);
    }
    .gameover-card .row {
      display: flex;
      justify-content: space-around;
      gap: 1.2rem;
      flex-wrap: wrap;
      margin: 0.6rem 0 1.2rem;
    }
    .gameover-card .row .stat {
      background: rgba(255,255,255,0.06);
      border: 3px solid gold;
      padding: 0.5rem 0.9rem;
      border-radius: 14px;
      min-width: 110px;
    }
    .gameover-card .row .stat .label { font-size: 0.65rem; opacity: 0.75; letter-spacing: 0.18em; }
    .gameover-card .row .stat .val   { font-size: 1.4rem; color: gold; text-shadow: 2px 2px 0 #000; }
    .gameover-card .actions {
      display: flex;
      gap: 0.7rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      background: rgba(255,255,255,0.08);
      border: 3px solid white;
      color: white;
      font-family: inherit;
      font-weight: 900;
      font-size: 1rem;
      padding: 0.6rem 1.2rem;
      border-radius: 14px;
      letter-spacing: 0.08em;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.18s;
      text-shadow: 2px 2px 0 #000;
    }
    .btn.primary {
      background: gold;
      color: black;
      border-color: white;
      text-shadow: none;
      box-shadow: 0 0 0 3px gold, 0 0 26px rgba(255,215,0,0.7);
    }
    .btn:hover { transform: scale(1.06) rotate(-1deg); }
    .btn:active { transform: scale(0.94); }

    .new-best {
      color: #00e676;
      font-size: 1rem;
      text-shadow: 2px 2px 0 #000, 0 0 14px rgba(0,230,118,0.8);
      letter-spacing: 0.18em;
      margin-bottom: 0.4rem;
      animation: newBestPulse 0.8s ease-in-out infinite;
    }
    @keyframes newBestPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.08); }
    }

    @media (max-width: 600px) {
      #bean { width: 70px; height: 70px; border-width: 5px; }
      #beanShadow { width: 60px; height: 11px; }
      .obstacle { width: 58px; height: 58px; font-size: 2rem; border-width: 4px; }
      .treat { width: 46px; height: 46px; font-size: 1.6rem; border-width: 4px; }
      .topbar { padding: 0.5rem 0.7rem; }
      .topbar a, .topbar .stat { padding: 0.35rem 0.7rem; font-size: 0.85rem; }
      .stat .val { font-size: 1rem; }
      #title { top: 4.2rem; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="../" id="back">← chombus</a>
    <div class="stats-group">
      <div class="stat" id="score-stat"><span class="label">SCORE</span><span class="val" id="score">0</span></div>
      <div class="stat" id="best-stat"><span class="label">BEST</span><span class="val" id="best">0</span></div>
      <div class="stat" id="speed-stat"><span class="label">SPEED</span><span class="val" id="speed">×1.0</span></div>
    </div>
  </div>

  <h1 id="title">
    <span>B</span><span>E</span><span>A</span><span>N</span><span class="sp">&nbsp;</span><span>R</span><span>U</span><span>N</span><span>N</span><span>E</span><span>R</span>
  </h1>

  <div id="stage">
    <div class="parallax" id="stars"></div>
    <div class="parallax" id="clouds"></div>
    <div id="ground"></div>
    <div id="beanShadow"></div>
    <div id="bean"></div>
  </div>

  <div class="cursor-dot" id="cursor">⭐</div>

  <div class="overlay" id="countdown-overlay">
    <div id="countdown">
      <span class="ready">GET READY</span>
      <span id="countdown-num">3</span>
    </div>
    <div class="controls-hint">SPACE / TAP / CLICK to JUMP &middot; tap again mid-air for DOUBLE JUMP</div>
  </div>

  <div class="overlay hidden" id="gameover-overlay">
    <div class="gameover-card">
      <h2>GAME OVER</h2>
      <div id="new-best-flag" class="new-best" style="display:none;">★ NEW BEST! ★</div>
      <div class="row">
        <div class="stat"><span class="label">SCORE</span><br><span class="val" id="final-score">0</span></div>
        <div class="stat"><span class="label">BEST</span><br><span class="val" id="final-best">0</span></div>
        <div class="stat"><span class="label">TREATS</span><br><span class="val" id="final-treats">0</span></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="play-again">PLAY AGAIN</button>
        <a class="btn" href="../">← BACK TO CHOMBUS</a>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
  (function(){
    'use strict';

    // ---------- DOM refs ----------
    const stage      = document.getElementById('stage');
    const bean       = document.getElementById('bean');
    const beanShadow = document.getElementById('beanShadow');
    const ground     = document.getElementById('ground');
    const stars      = document.getElementById('stars');
    const clouds     = document.getElementById('clouds');
    const scoreEl    = document.getElementById('score');
    const bestEl     = document.getElementById('best');
    const speedEl    = document.getElementById('speed');
    const countdownOv  = document.getElementById('countdown-overlay');
    const countdownNum = document.getElementById('countdown-num');
    const gameoverOv   = document.getElementById('gameover-overlay');
    const finalScore   = document.getElementById('final-score');
    const finalBest    = document.getElementById('final-best');
    const finalTreats  = document.getElementById('final-treats');
    const newBestFlag  = document.getElementById('new-best-flag');
    const playAgainBtn = document.getElementById('play-again');
    const cursor       = document.getElementById('cursor');

    // ---------- State ----------
    const state = {
      photos: [],
      running: false,
      gameover: false,
      score: 0,
      treatCount: 0,
      best: parseInt(localStorage.getItem('chombus-runner-best') || '0', 10) || 0,
      // Bean: y is offset above ground in px (jump height), positive = up
      beanY: 0,
      beanVY: 0,
      jumps: 0,           // 0 grounded, 1 single, 2 double
      worldX: 0,          // accumulated scroll
      baseSpeed: 320,     // px/sec at multiplier 1
      multiplier: 1,
      lastSpawnObstacle: 0,
      lastSpawnTreat: 0,
      lastMilestone: 0,
      obstacles: [],
      treats: [],
      cloudEls: []
    };

    // ---------- Constants & sizing ----------
    const GRAVITY = 2300;
    const JUMP_VEL = 920;
    const DOUBLE_JUMP_VEL = 780;
    const GROUND_TOP_VH = 70;
    const BEAN_LEFT_VW = 16;
    let groundTopPx, beanSize, groundLine, beanLeftPx;

    bestEl.textContent = state.best;

    function recalcSize() {
      groundTopPx = window.innerHeight * GROUND_TOP_VH / 100;
      beanSize    = window.innerWidth < 600 ? 70 : 90;
      bean.style.width = bean.style.height = beanSize + 'px';
      const shadowW = beanSize - 10;
      beanShadow.style.width = shadowW + 'px';
      groundLine = groundTopPx;
      beanLeftPx = window.innerWidth * BEAN_LEFT_VW / 100;
      bean.style.left = beanLeftPx + 'px';
      placeBean();
    }
    window.addEventListener('resize', recalcSize);

    function placeBean() {
      const top = groundLine - beanSize - state.beanY;
      bean.style.top = top + 'px';
      const shadowTop = groundLine - 8;
      const shrink = Math.max(0.35, 1 - state.beanY / 320);
      beanShadow.style.top = shadowTop + 'px';
      beanShadow.style.left = (beanLeftPx + 5) + 'px';
      beanShadow.style.transform = `scaleX(${shrink}) scaleY(${shrink})`;
      beanShadow.style.opacity = 0.75 * shrink;
    }

    // ---------- Manifest ----------
    async function loadManifest() {
      try {
        const res = await fetch('../manifest.json?t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data.photos) && data.photos.length) {
            state.photos = data.photos.map(p => p.startsWith('http') ? p : '../' + p);
          }
        }
      } catch (e) {
        console.warn('manifest load failed', e);
      }
      if (state.photos.length) {
        bean.style.backgroundImage = `url('${state.photos[0]}')`;
      } else {
        bean.style.background = 'white';
        bean.textContent = '🐶';
        bean.style.display = 'flex';
        bean.style.alignItems = 'center';
        bean.style.justifyContent = 'center';
        bean.style.fontSize = '3rem';
      }
    }

    // ---------- Decorative clouds ----------
    function spawnClouds() {
      const cloudGlyphs = ['☁️','⭐','✨','🌟','💫','🌈','🦴'];
      const count = 9;
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'cloud';
        el.textContent = cloudGlyphs[Math.floor(Math.random() * cloudGlyphs.length)];
        el.style.fontSize = (2.4 + Math.random() * 3.2) + 'rem';
        el.style.opacity = 0.55 + Math.random() * 0.4;
        el.style.left = Math.random() * window.innerWidth + 'px';
        el.style.top  = Math.random() * Math.max(60, groundTopPx - 80) + 'px';
        el.dataset.speed = (0.18 + Math.random() * 0.4).toString();
        clouds.appendChild(el);
        state.cloudEls.push(el);
      }
    }

    // ---------- Cursor sparkle trail ----------
    let lastTrailAt = 0;
    const trailGlyphs = ['✨','⭐','🌟','💫','⚡'];
    function spawnTrail(x, y) {
      const el = document.createElement('div');
      el.className = 'cursor-trail';
      el.textContent = trailGlyphs[Math.floor(Math.random() * trailGlyphs.length)];
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      el.style.fontSize = (0.7 + Math.random() * 0.6) + 'rem';
      document.body.appendChild(el);
      gsap.fromTo(el,
        { scale: 0.4, opacity: 1, rotation: 0 },
        {
          scale: 1.4,
          x: (Math.random() - 0.5) * 60,
          y: 20 + Math.random() * 40,
          rotation: (Math.random() - 0.5) * 540,
          opacity: 0,
          duration: 0.9,
          ease: 'power2.out',
          onComplete: () => el.remove()
        }
      );
    }
    document.addEventListener('mousemove', (e) => {
      if (cursor) {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top  = e.clientY + 'px';
      }
      const now = performance.now();
      if (now - lastTrailAt > 36) {
        spawnTrail(e.clientX, e.clientY);
        lastTrailAt = now;
      }
    });

    // ---------- Sparkle helpers ----------
    function spawnBeanFootSparkle() {
      if (!state.running) return;
      const el = document.createElement('div');
      el.className = 'sparkle';
      el.textContent = trailGlyphs[Math.floor(Math.random() * trailGlyphs.length)];
      const x = beanLeftPx + beanSize * 0.35 + Math.random() * 10;
      const y = groundLine - 6;
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      el.style.fontSize = (0.7 + Math.random() * 0.5) + 'rem';
      stage.appendChild(el);
      gsap.fromTo(el,
        { scale: 0.5, opacity: 1 },
        {
          scale: 1.2,
          x: -80 - Math.random() * 90,
          y: -10 - Math.random() * 18,
          rotation: (Math.random() - 0.5) * 360,
          opacity: 0,
          duration: 0.9 + Math.random() * 0.6,
          ease: 'power2.out',
          onComplete: () => el.remove()
        }
      );
    }

    function spawnAmbientSparkle() {
      const el = document.createElement('div');
      el.className = 'sparkle';
      el.textContent = trailGlyphs[Math.floor(Math.random() * trailGlyphs.length)];
      el.style.left = Math.random() * window.innerWidth + 'px';
      el.style.top  = Math.random() * groundTopPx + 'px';
      el.style.fontSize = (0.8 + Math.random() * 0.9) + 'rem';
      stage.appendChild(el);
      gsap.fromTo(el,
        { scale: 0, opacity: 0, rotation: 0 },
        {
          scale: 1, opacity: 1, rotation: 360, duration: 0.5,
          onComplete: () => gsap.to(el, { opacity: 0, scale: 0, duration: 0.5, onComplete: () => el.remove() })
        }
      );
    }

    function spawnConfettiBurst(x, y) {
      const glyphs = ['✨','⭐','🌟','💫','🍖','🥩','🥓','🦴'];
      for (let i = 0; i < 14; i++) {
        const el = document.createElement('div');
        el.className = 'sparkle';
        el.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
        el.style.left = x + 'px';
        el.style.top  = y + 'px';
        el.style.fontSize = (1 + Math.random() * 1.1) + 'rem';
        stage.appendChild(el);
        const ang  = Math.random() * Math.PI * 2;
        const dist = 50 + Math.random() * 130;
        gsap.fromTo(el,
          { scale: 0.4, opacity: 1, rotation: 0 },
          {
            scale: 1.4,
            x: Math.cos(ang) * dist,
            y: Math.sin(ang) * dist - 30,
            rotation: (Math.random() - 0.5) * 720,
            opacity: 0,
            duration: 0.9 + Math.random() * 0.5,
            ease: 'power2.out',
            onComplete: () => el.remove()
          }
        );
      }
    }

    function spawnPopup(x, y, text, color) {
      const el = document.createElement('div');
      el.className = 'popup';
      el.textContent = text;
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      if (color) el.style.color = color;
      stage.appendChild(el);
      gsap.fromTo(el,
        { y: 0, opacity: 1, scale: 0.8 },
        { y: -90, opacity: 0, scale: 1.4, duration: 1.1, ease: 'power2.out', onComplete: () => el.remove() }
      );
    }

    function showMilestone(text) {
      const el = document.createElement('div');
      el.className = 'milestone';
      el.textContent = text;
      const colors = ['#ff1744','#ff9100','#ffea00','#00e676','#00b0ff','#b388ff','#ff4081'];
      el.style.color = colors[Math.floor(Math.random() * colors.length)];
      document.body.appendChild(el);
      gsap.fromTo(el,
        { scale: 0, rotation: -25, opacity: 0 },
        {
          scale: 1.2, rotation: 0, opacity: 1, duration: 0.5, ease: 'back.out(1.8)',
          onComplete: () => gsap.to(el, {
            scale: 1.6, opacity: 0, rotation: 25, duration: 0.7, ease: 'power2.in', delay: 0.6,
            onComplete: () => el.remove()
          })
        }
      );
    }

    // ---------- Obstacles + treats ----------
    const OBSTACLE_GLYPHS = ['🧹','🛁','🥦','🧴','🪥'];
    const TREAT_GLYPHS    = ['🍖','🥩','🥓','🦴'];

    function spawnObstacle() {
      const el = document.createElement('div');
      el.className = 'obstacle';
      el.textContent = OBSTACLE_GLYPHS[Math.floor(Math.random() * OBSTACLE_GLYPHS.length)];
      const size = window.innerWidth < 600 ? 58 : 70;
      el.style.width = el.style.height = size + 'px';
      const x = window.innerWidth + 30;
      // 65% on ground, 35% flying low (clearable with jump, harder to clear without double-jump)
      const flying = Math.random() < 0.35;
      let y;
      if (flying) {
        y = groundTopPx - size - (130 + Math.random() * 60);
      } else {
        y = groundTopPx - size + 6;
      }
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      stage.appendChild(el);
      state.obstacles.push({ el, x, y, w: size, h: size, flying });
    }

    function spawnTreat() {
      const el = document.createElement('div');
      el.className = 'treat';
      el.textContent = TREAT_GLYPHS[Math.floor(Math.random() * TREAT_GLYPHS.length)];
      const size = window.innerWidth < 600 ? 46 : 56;
      el.style.width = el.style.height = size + 'px';
      const x = window.innerWidth + 30;
      const y = groundTopPx - size - (90 + Math.random() * 140);
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      stage.appendChild(el);
      state.treats.push({ el, x, y, w: size, h: size, collected: false });
    }

    // ---------- Jump ----------
    function jump() {
      if (!state.running || state.gameover) return;
      if (state.jumps >= 2) return;
      const isFirst = state.jumps === 0;
      state.beanVY = isFirst ? JUMP_VEL : DOUBLE_JUMP_VEL;
      state.jumps += 1;
      // Squash/stretch — temporarily disable run anim, run a GSAP sequence, then restore.
      bean.style.animation = 'none';
      gsap.killTweensOf(bean);
      gsap.fromTo(bean,
        { scaleX: 1.3, scaleY: 0.7, rotation: 0 },
        {
          scaleX: 0.85, scaleY: 1.2,
          rotation: isFirst ? -30 : -540,
          duration: 0.18, ease: 'power2.out',
          onComplete: () => {
            gsap.to(bean, {
              scaleX: 1, scaleY: 1, rotation: 0,
              duration: 0.25, ease: 'power1.out',
              onComplete: () => { if (state.running && !state.gameover) bean.style.animation = ''; }
            });
          }
        }
      );
      // Foot-puff sparkles
      for (let i = 0; i < 6; i++) {
        const el = document.createElement('div');
        el.className = 'sparkle';
        el.textContent = trailGlyphs[Math.floor(Math.random() * trailGlyphs.length)];
        const x = beanLeftPx + beanSize * 0.5;
        const y = groundLine - 6 - (isFirst ? 0 : state.beanY);
        el.style.left = x + 'px';
        el.style.top  = y + 'px';
        stage.appendChild(el);
        gsap.fromTo(el,
          { scale: 0.4, opacity: 1, rotation: 0 },
          {
            x: (Math.random() - 0.5) * 100,
            y: -10 - Math.random() * 30,
            rotation: (Math.random() - 0.5) * 540,
            scale: 1.4, opacity: 0,
            duration: 0.7, ease: 'power2.out',
            onComplete: () => el.remove()
          }
        );
      }
    }

    // ---------- Collision ----------
    function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }
    function getBeanBox() {
      const top = groundLine - beanSize - state.beanY;
      const inset = beanSize * 0.12;
      return { x: beanLeftPx + inset, y: top + inset, w: beanSize - inset * 2, h: beanSize - inset * 2 };
    }

    // ---------- Game loop ----------
    let lastT = performance.now();
    let beanSparkleAccum = 0;
    let ambientSparkleAccum = 0;

    function frame(now) {
      const dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;
      if (state.running && !state.gameover) update(dt);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame((t) => { lastT = t; requestAnimationFrame(frame); });

    function update(dt) {
      // Bean physics
      if (state.beanY > 0 || state.beanVY > 0) {
        state.beanVY -= GRAVITY * dt;
        state.beanY  += state.beanVY * dt;
        if (state.beanY <= 0) {
          state.beanY = 0;
          state.beanVY = 0;
          state.jumps = 0;
        }
      }
      placeBean();

      const speed = state.baseSpeed * state.multiplier;
      const dx = speed * dt;
      state.worldX += dx;

      // Score: distance + treats
      const newDistScore = Math.floor(state.worldX / 24);
      const newScore = newDistScore + state.treatCount * 5;
      if (newScore !== state.score) {
        state.score = newScore;
        scoreEl.textContent = state.score;
      }

      // Speed ramp every 200 score
      const targetMult = 1 + Math.floor(state.score / 200) * 0.18;
      if (targetMult > state.multiplier + 0.001) {
        state.multiplier = targetMult;
        speedEl.textContent = '×' + state.multiplier.toFixed(1);
        const milestoneIdx = Math.floor(state.score / 200);
        if (milestoneIdx > state.lastMilestone) {
          state.lastMilestone = milestoneIdx;
          const phrases = ['FAST BOY!','ZOOM!','TURBO BEAN!','BEAN BREAKS THE SOUND BARRIER!','LIGHT SPEED!','BLAZING!','BEAN GO BRRR!','HYPER BEAN!','UNHINGED BEAN!','RIDICULOUS!'];
          showMilestone(phrases[Math.min(milestoneIdx - 1, phrases.length - 1)]);
        }
      }

      // Parallax: stars
      const starsBgX = -(state.worldX * 0.15) % 600;
      stars.style.backgroundPosition = starsBgX + 'px 0';
      // Clouds
      for (const c of state.cloudEls) {
        const cs = parseFloat(c.dataset.speed);
        const left = parseFloat(c.style.left) - dx * cs;
        if (left < -200) {
          c.style.left = (window.innerWidth + 50 + Math.random() * 200) + 'px';
          c.style.top  = Math.random() * Math.max(60, groundTopPx - 80) + 'px';
        } else {
          c.style.left = left + 'px';
        }
      }
      // Ground stripe scroll
      const groundOffset = -(state.worldX % 120);
      ground.style.backgroundPosition = `${groundOffset}px 0, 0 0`;

      // Spawn obstacles
      const obstacleInterval = Math.max(0.55, 1.4 - (state.multiplier - 1) * 0.32);
      state.lastSpawnObstacle += dt;
      if (state.lastSpawnObstacle > obstacleInterval + Math.random() * 0.5) {
        state.lastSpawnObstacle = 0;
        spawnObstacle();
      }
      // Spawn treats
      state.lastSpawnTreat += dt;
      if (state.lastSpawnTreat > 1.6 + Math.random() * 1.2) {
        state.lastSpawnTreat = 0;
        spawnTreat();
      }

      // Move + collide obstacles
      const beanBox = getBeanBox();
      for (let i = state.obstacles.length - 1; i >= 0; i--) {
        const o = state.obstacles[i];
        o.x -= dx;
        o.el.style.left = o.x + 'px';
        // Tighter circular hitbox via inset
        if (aabb(beanBox.x, beanBox.y, beanBox.w, beanBox.h,
                 o.x + o.w * 0.14, o.y + o.h * 0.14, o.w * 0.72, o.h * 0.72)) {
          gameOver();
          return;
        }
        if (o.x + o.w < -50) {
          o.el.remove();
          state.obstacles.splice(i, 1);
        }
      }

      // Move + collect treats
      for (let i = state.treats.length - 1; i >= 0; i--) {
        const t = state.treats[i];
        t.x -= dx;
        t.el.style.left = t.x + 'px';
        if (!t.collected && aabb(beanBox.x, beanBox.y, beanBox.w, beanBox.h,
                                  t.x + t.w * 0.15, t.y + t.h * 0.15, t.w * 0.7, t.h * 0.7)) {
          t.collected = true;
          state.treatCount += 1;
          // Score will resync on next dist update; show popup now
          spawnConfettiBurst(t.x + t.w / 2, t.y + t.h / 2);
          spawnPopup(t.x + t.w / 2, t.y, '+5', '#ffea00');
          gsap.to(t.el, { scale: 1.8, opacity: 0, rotation: 540, duration: 0.35, ease: 'power2.out',
            onComplete: () => { if (t.el.parentNode) t.el.remove(); } });
          state.treats.splice(i, 1);
          continue;
        }
        if (t.x + t.w < -50) {
          if (t.el.parentNode) t.el.remove();
          state.treats.splice(i, 1);
        }
      }

      // Bean foot sparkles only when grounded
      beanSparkleAccum += dt;
      if (beanSparkleAccum > 0.07) {
        beanSparkleAccum = 0;
        if (state.beanY < 4) spawnBeanFootSparkle();
      }
      // Ambient sparkles
      ambientSparkleAccum += dt;
      if (ambientSparkleAccum > 0.25) {
        ambientSparkleAccum = 0;
        spawnAmbientSparkle();
      }
    }

    // ---------- Game flow ----------
    function clearWorld() {
      for (const o of state.obstacles) if (o.el.parentNode) o.el.remove();
      for (const t of state.treats)   if (t.el.parentNode) t.el.remove();
      state.obstacles = [];
      state.treats = [];
    }

    function reset() {
      gsap.killTweensOf(bean);
      state.running = false;
      state.gameover = false;
      state.score = 0;
      state.treatCount = 0;
      state.beanY = 0;
      state.beanVY = 0;
      state.jumps = 0;
      state.worldX = 0;
      state.multiplier = 1;
      state.lastSpawnObstacle = 0;
      state.lastSpawnTreat = 0;
      state.lastMilestone = 0;
      clearWorld();
      scoreEl.textContent = '0';
      speedEl.textContent = '×1.0';
      bean.style.opacity = 1;
      bean.style.filter = '';
      bean.style.transform = '';
      bean.style.animation = '';
      placeBean();
    }

    function start() {
      reset();
      countdownOv.classList.remove('hidden');
      gameoverOv.classList.add('hidden');
      let n = 3;
      countdownNum.textContent = n;
      gsap.fromTo(countdownNum, { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.35, ease: 'back.out(2)' });
      const tick = setInterval(() => {
        n -= 1;
        if (n > 0) {
          countdownNum.textContent = n;
          gsap.fromTo(countdownNum, { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.35, ease: 'back.out(2)' });
        } else if (n === 0) {
          countdownNum.textContent = 'GO!';
          gsap.fromTo(countdownNum, { scale: 0, rotation: -90 }, { scale: 1.3, rotation: 0, duration: 0.3, ease: 'back.out(2)' });
        } else {
          clearInterval(tick);
          countdownOv.classList.add('hidden');
          state.running = true;
          lastT = performance.now();
        }
      }, 700);
    }

    function gameOver() {
      if (state.gameover) return;
      state.gameover = true;
      state.running = false;
      // Bean death wiggle
      bean.style.animation = 'none';
      gsap.killTweensOf(bean);
      gsap.to(bean, { rotation: 720, scale: 0.7, opacity: 0.4, duration: 0.7, ease: 'power2.out' });
      // Two confetti bursts at bean
      const beanBox = getBeanBox();
      spawnConfettiBurst(beanBox.x + beanBox.w / 2, beanBox.y + beanBox.h / 2);
      spawnConfettiBurst(beanBox.x + beanBox.w / 2, beanBox.y + beanBox.h / 2);

      finalScore.textContent  = state.score;
      finalTreats.textContent = state.treatCount;
      const isNewBest = state.score > state.best;
      if (isNewBest) {
        state.best = state.score;
        localStorage.setItem('chombus-runner-best', String(state.best));
        bestEl.textContent = state.best;
        newBestFlag.style.display = 'block';
      } else {
        newBestFlag.style.display = 'none';
      }
      finalBest.textContent = state.best;

      setTimeout(() => {
        gameoverOv.classList.remove('hidden');
        gsap.fromTo(gameoverOv.querySelector('.gameover-card'),
          { scale: 0.6, rotation: -8, opacity: 0 },
          { scale: 1, rotation: 0, opacity: 1, duration: 0.5, ease: 'back.out(1.7)' }
        );
      }, 600);
    }

    // ---------- Input ----------
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (state.gameover && !gameoverOv.classList.contains('hidden')) {
          start();
          return;
        }
        if (state.running) jump();
      }
    });
    document.addEventListener('pointerdown', (e) => {
      // Don't intercept clicks on links/buttons
      if (e.target && e.target.closest && e.target.closest('a, button')) return;
      if (state.gameover && !gameoverOv.classList.contains('hidden')) return; // overlay buttons handle restart
      if (state.running) jump();
    });
    playAgainBtn.addEventListener('click', (e) => { e.stopPropagation(); start(); });

    // Periodic ambient sparkle even outside game (low rate)
    setInterval(() => {
      if (!state.running) spawnAmbientSparkle();
    }, 350);

    // ---------- Boot ----------
    (async () => {
      recalcSize();
      spawnClouds();
      await loadManifest();
      recalcSize();
      start();
    })();
  })();
  </script>
</body>
</html>
